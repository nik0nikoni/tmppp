{% extends "base.html" %}

{% block title %}LMS Integration{% endblock %}

{% block content %}

<div class="max-w-3xl mx-auto">
    <div class="bg-white rounded-xl shadow p-6 mb-6">
        <h2 class="text-xl font-semibold mb-2">LMS Integration</h2>
        <p class="text-slate-500 text-sm mb-6">
            This page demonstrates the Adapter pattern.
        </p>

        <form method="post" action="/pages/integration/enroll" class="space-y-5">

            <div>
                <label class="block text-sm font-medium mb-1">System</label>
                <select
                    name="system"
                    required
                    class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                >
                    <option value="moodle">Moodle</option>
                    <option value="google">Google Classroom</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Student name</label>
                <input
                    type="text"
                    name="student_name"
                    required
                    class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="student1"
                >
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Course name</label>
                <input
                    type="text"
                    name="course_name"
                    required
                    class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Python Basics"
                >
            </div>

            <button
                type="submit"
                class="w-full bg-slate-800 text-white py-2.5 rounded-lg hover:bg-slate-900 transition"
            >
                Enroll via Adapter
            </button>
        </form>
    </div>

    <div class="bg-white rounded-xl shadow p-6">
        <h3 class="text-lg font-semibold mb-3">Result</h3>

        {% if result %}
            <div class="rounded-lg bg-blue-100 text-blue-700 px-4 py-3">
                {{ result }}
            </div>
        {% else %}
            <p class="text-slate-500">
                No integration result yet.
            </p>
        {% endif %}
    </div>
</div>

{% endblock %}
